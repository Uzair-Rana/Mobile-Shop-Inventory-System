{% extends "web/base.html" %}
{% block content %}
<div class="page-header">
    <h1 class="page-title gradient-text">New Transfer</h1>
    <p class="page-subtitle">Record a stock transfer between branches</p>
</div>

<div class="form-card">
    {% if error %}<div class="form-error">⚠ {{ error }}</div>{% endif %}
    <form method="post" action="{% url 'web:transfer_add' %}">
        {% csrf_token %}
        <div class="form-grid-2">
            <div class="form-field">
                <label class="form-label">From Branch *</label>
                <select name="from_branch" class="form-select" required>
                    <option value="">— Select —</option>
                    {% for b in branches %}<option value="{{ b.pk }}">{{ b.name }}</option>{% endfor %}
                </select>
            </div>
            <div class="form-field">
                <label class="form-label">To Branch *</label>
                <select name="to_branch" class="form-select" required>
                    <option value="">— Select —</option>
                    {% for b in branches %}<option value="{{ b.pk }}">{{ b.name }}</option>{% endfor %}
                </select>
            </div>
            <div class="form-field">
                <label class="form-label">Status</label>
                <select name="status" class="form-select">
                    {% for val, label in statuses %}<option value="{{ val }}">{{ label }}</option>{% endfor %}
                </select>
            </div>
        </div>
        <div class="form-field" style="margin-top:.75rem">
            <label class="form-label">Notes</label>
            <textarea name="notes" class="form-textarea" rows="2" placeholder="Optional"></textarea>
        </div>
        {% if not branches %}
        <p style="color:#be123c;font-size:.85rem;margin-top:.75rem">No branches exist yet — add branches in Settings first.</p>
        {% endif %}
        <div class="form-actions" style="margin-top:1rem">
            <button type="submit" class="btn btn-primary">💾 Save Transfer</button>
            <a href="{% url 'web:transfers' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
