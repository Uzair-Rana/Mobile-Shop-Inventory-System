{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Activate — {{ site_company.name|default:"My Phone" }}</title>
    <link rel="stylesheet" href="{% static 'web/app.css' %}">
</head>

<body class="login-page">
    <div class="login-wrap">
        <div class="login-card">
            <div class="login-brand">
                <img src="{% if site_company.logo %}{{ site_company.logo.url }}{% else %}{% static 'web/logo.png' %}{% endif %}"
                    alt="logo" style="width:72px;height:72px;object-fit:contain;border-radius:14px;display:block;margin:0 auto 1rem" />
                <h1 class="login-title">Activate Software</h1>
                <p class="login-sub">Enter your installation key to continue</p>
            </div>

            {% if error %}<div class="login-alert">{{ error }}</div>{% endif %}

            <form method="post" class="login-form">
                {% csrf_token %}
                <div class="lf-group">
                    <label class="lf-label">Installation Key</label>
                    <input type="text" name="key" autofocus autocomplete="off" class="lf-input"
                        placeholder="Enter installation key" />
                </div>
                <button type="submit" class="login-btn">Activate →</button>
            </form>

            <p class="login-hint">Created by <strong style="color:#e11d48">DevNest System</strong></p>
        </div>
    </div>

    <style>
        .login-page {
            background: #0c0e13;
            background-image: radial-gradient(ellipse at 30% 20%, rgba(225, 29, 72, .18) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 80%, rgba(29, 78, 216, .12) 0%, transparent 50%);
            display: flex; align-items: center; justify-content: center; min-height: 100vh;
        }
        .login-wrap { width: 100%; max-width: 420px; padding: 1.5rem; }
        .login-card {
            background: rgba(255, 255, 255, .97); border-radius: 20px; padding: 2.5rem 2rem 2rem;
            box-shadow: 0 0 0 1px rgba(255,255,255,.1), 0 28px 64px rgba(0,0,0,.55), 0 4px 16px rgba(225,29,72,.15);
        }
        .login-brand { text-align: center; margin-bottom: 1.75rem; }
        .login-title { font-size: 1.6rem; font-weight: 900; color: #0f1117; letter-spacing: -.04em; margin: 0 0 .2rem; }
        .login-sub { font-size: .875rem; color: #9ca3af; margin: 0; }
        .login-alert { background: #fff1f2; border: 1px solid #fecdd3; color: #be123c; border-radius: 10px;
            padding: .75rem 1rem; font-size: .875rem; font-weight: 600; margin-bottom: 1rem; }
        .login-form { display: flex; flex-direction: column; gap: 1rem; }
        .lf-group { display: flex; flex-direction: column; gap: .35rem; }
        .lf-label { font-size: .8125rem; font-weight: 700; color: #374151; }
        .lf-input { padding: .625rem .875rem; border: 1.5px solid #e5e7eb; border-radius: 10px;
            font-size: .9375rem; font-family: inherit; outline: none; transition: border-color 140ms; }
        .lf-input:focus { border-color: #e11d48; box-shadow: 0 0 0 3px rgba(225,29,72,.1); }
        .login-btn { margin-top: .25rem; padding: .7rem 1rem; border-radius: 10px; border: none;
            background: linear-gradient(135deg, #e11d48, #be123c); color: #fff; font-size: 1rem;
            font-weight: 800; cursor: pointer; box-shadow: 0 4px 16px rgba(190,18,60,.35); transition: all 150ms; }
        .login-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(190,18,60,.45); }
        .login-hint { text-align: center; font-size: .8rem; color: #9ca3af; margin-top: 1rem; }
    </style>
</body>

</html>
